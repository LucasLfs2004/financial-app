        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/items/{item_id}/occurrences/{reference_month}/invoice-moves:
    parameters:
      - $ref: "#/components/parameters/ItemID"
      - $ref: "#/components/parameters/ReferenceMonth"
    post:
      operationId: moveFinancialItemOccurrenceInvoice
      tags: [Card invoices]
      summary: Mover uma ocorrência para outra fatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceOccurrenceMoveRequest"
            example:
              target_credit_card_id: 0f9410d7-d545-4440-a574-b37836487c3c
              target_payment_month: 2027-01
              reason: Compra processada no ciclo seguinte
      responses:
        "201":
          description: Movimentação registrada
          content:
