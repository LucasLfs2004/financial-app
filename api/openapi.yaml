          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/months/{month}/summary:
    get:
      operationId: getMonthlySummary
      tags: [Monthly summary]
      summary: Calcular o resumo projetado de uma competência
      description: |
        `cash` responde quanto está livre considerando recebimentos e
        pagamentos. `reference` consolida a competência econômica e não
        representa saldo disponível em conta.
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/SummaryBasis"
      responses:
        "200":
          description: Resumo explicável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummaryResponse"
              examples:
                cashSummary:
                  value:
                    data:
                      month: 2026-07
                      basis: cash
                      result_kind: planned_free
                      currency_code: BRL
                      plan_status: draft
                      income_cents: 600000
                      commitments_cents: 280000
                      planned_savings_cents: 120000
                      result_cents: 200000
                      is_negative: false
                      completeness: projected
                      breakdown:
                        recurring_income_cents: 600000
                        one_time_income_cents: 0
                        fixed_expenses_cents: 210000
                        projected_variable_expenses_cents: 70000
                        card_invoice_adjustments_cents: 0
                      sources:
                        - source_id: 1960b556-1201-4bc0-8292-b4adc600bc5e
                          item_id: f449925d-ab01-4a45-b084-612228bce21f
                          name: Salário
                          kind: recurring_income
                          effect: income
                          reference_month: 2026-06
                          cash_month: 2026-07
                          amount_cents: 600000
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/MonthOutsideHorizon"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    InstitutionID:
      name: institution_id
      in: path
      required: true
      description: Instituição pertencente ao usuário autenticado.
      schema:
        $ref: "#/components/schemas/UUID"
    CardID:
      name: card_id
      in: path
      required: true
      description: Cartão pertencente ao usuário autenticado.
      schema:
        $ref: "#/components/schemas/UUID"
    AdjustmentID:
      name: adjustment_id
      in: path
      required: true
      description: Ajuste pertencente à fatura indicada na rota.
      schema:
        $ref: "#/components/schemas/UUID"
    ItemID:
      name: item_id
      in: path
      required: true
      description: Identificador do item pertencente ao usuário autenticado.
      schema:
        type: string
        format: uuid
    Month:
      name: month
      in: path
      required: true
      description: Competência mensal no formato `AAAA-MM`.
      schema:
        $ref: "#/components/schemas/YearMonth"
    ReferenceMonth:
      name: reference_month
      in: path
      required: true
      description: Competência que identifica a ocorrência do item.
      schema:
        $ref: "#/components/schemas/YearMonth"
    PaymentMonth:
      name: payment_month
      in: path
      required: true
      description: Mês de pagamento que identifica a fatura projetada.
      schema:
        $ref: "#/components/schemas/YearMonth"
    InvoiceFromMonth:
      name: from
      in: query
      required: true
      description: Primeiro mês do intervalo inclusivo de faturas.
      schema:
        $ref: "#/components/schemas/YearMonth"
    InvoiceToMonth:
      name: to
      in: query
      required: true
      description: Último mês do intervalo inclusivo de faturas.
      schema:
        $ref: "#/components/schemas/YearMonth"
    IncludeEmptyInvoices:
      name: include_empty
      in: query
      required: false
      description: Inclui meses sem componentes quando verdadeiro.
      schema:
        type: boolean
        default: false
    SummaryBasis:
      name: basis
      in: query
      required: false
      description: Base de consolidação. O padrão é `cash`.
      schema:
        $ref: "#/components/schemas/SummaryBasis"
    FinancialItemKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FinancialItemKind"
    FinancialItemStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FinancialItemStatus"
    FinancialResourceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FinancialResourceStatus"
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    UUID:
      type: string
      format: uuid
    YearMonth:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: [2026-07]
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [BRL]
    AmountCents:
      type: integer
      format: int64
      minimum: 0
      description: Valor monetário não negativo representado em centavos.
      examples: [120000]
    SignedAmountCents:
      type: integer
      format: int64
      description: Resultado monetário em centavos; pode ser negativo.
      examples: [200000, -50000]
    PlanStatus:
      type: string
      enum: [draft, active, archived]
    FinancialItemKind:
      type: string
      enum:
        - recurring_income
        - one_time_income
        - fixed_expense
        - projected_variable_expense
    FinancialItemStatus:
      type: string
      enum: [active, archived]
    FinancialResourceStatus:
      type: string
      enum: [active, archived]
    PaymentMethod:
      type: string
      enum: [direct, credit_card]
    CardInvoiceComponentType:
      type: string
      enum: [financial_item_occurrence, invoice_adjustment]
    InvoiceAllocationOrigin:
      type: string
      enum: [calculated_from_reference, selected_invoice, moved_by_user]
    NominalDueDateResolution:
      type: string
      enum: [exact, invalid_for_month]
    InvoiceAdjustmentStatus:
      type: string
      enum: [active, archived]
    SummarySourceType:
      type: string
      enum: [financial_item_occurrence, planned_savings, invoice_adjustment]
    Recurrence:
      type: string
      enum: [monthly, once]
    SummaryBasis:
      type: string
      enum: [cash, reference]
      default: cash
    SummaryResultKind:
      type: string
      enum: [planned_free, planned_reference_result]
    SummarySourceEffect:
      type: string
      enum: [income, commitment, savings]
    Completeness:
      type: string
      enum: [projected]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name, timezone, currency_code]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]
        timezone:
          type: string
          examples: [America/Sao_Paulo]
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
    Plan:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - start_month
        - end_month
        - currency_code
        - activated_at
        - archived_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/PlanStatus"
        start_month:
          $ref: "#/components/schemas/YearMonth"
        end_month:
          $ref: "#/components/schemas/YearMonth"
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
        activated_at:
          type: [string, "null"]
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [name, start_month, end_month, currency_code]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        start_month:
          $ref: "#/components/schemas/YearMonth"
        end_month:
          $ref: "#/components/schemas/YearMonth"
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
    UpdatePlanRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        start_month:
          $ref: "#/components/schemas/YearMonth"
        end_month:
          $ref: "#/components/schemas/YearMonth"
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
    PlanResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Plan"
    FinancialPeriodInput:
      type: object
      additionalProperties: false
      required:
        - start_month
        - end_month
        - amount_cents
        - recurrence
        - cash_month_offset
      properties:
        start_month:
          $ref: "#/components/schemas/YearMonth"
        end_month:
          oneOf:
            - $ref: "#/components/schemas/YearMonth"
            - type: "null"
        amount_cents:
          $ref: "#/components/schemas/AmountCents"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        cash_month_offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 12
          default: 0
        context:
          type: [string, "null"]
          maxLength: 500
    FinancialPeriod:
      type: object
      additionalProperties: false
      required:
        - id
        - start_month
        - end_month
        - amount_cents
        - recurrence
        - cash_month_offset
        - context
        - recorded_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        start_month:
          $ref: "#/components/schemas/YearMonth"
        end_month:
          oneOf:
            - $ref: "#/components/schemas/YearMonth"
            - type: "null"
        amount_cents:
          $ref: "#/components/schemas/AmountCents"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        cash_month_offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 12
        context:
          type: [string, "null"]
          maxLength: 500
        recorded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    FinancialItem:
      type: object
      additionalProperties: false
      required:
        - id
        - plan_id
        - name
        - kind
        - description
        - status
        - archived_at
        - periods
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        plan_id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/FinancialItemKind"
        description:
          type: [string, "null"]
          maxLength: 1000
        status:
          $ref: "#/components/schemas/FinancialItemStatus"
        archived_at:
          type: [string, "null"]
          format: date-time
        periods:
          type: array
          items:
            $ref: "#/components/schemas/FinancialPeriod"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateFinancialItemRequest:
      type: object
      additionalProperties: false
      required: [name, kind, period]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/FinancialItemKind"
        description:
          type: [string, "null"]
          maxLength: 1000
        period:
          $ref: "#/components/schemas/FinancialPeriodInput"
    UpdateFinancialItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
    CreateFinancialItemChangeRequest:
      type: object
      additionalProperties: false
      required: [effective_from, end_month, amount_cents, cash_month_offset]
      properties:
        effective_from:
          $ref: "#/components/schemas/YearMonth"
        end_month:
          oneOf:
            - $ref: "#/components/schemas/YearMonth"
            - type: "null"
        amount_cents:
          $ref: "#/components/schemas/AmountCents"
        cash_month_offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 12
        context:
          type: [string, "null"]
          maxLength: 500
    ArchiveFinancialItemRequest:
      type: object
      additionalProperties: false
      properties:
        effective_from:
          description: |
            Primeira competência na qual o item deixa de gerar ocorrências. Se
            ausente, apenas o status atual é arquivado.
          oneOf:
            - $ref: "#/components/schemas/YearMonth"
            - type: "null"
        reason:
          type: [string, "null"]
          maxLength: 500
    FinancialItemResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FinancialItem"
    FinancialItemListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FinancialItem"
    SavingPeriod:
      type: object
      additionalProperties: false
      required:
        - id
        - start_month
        - end_month
        - amount_cents
        - context
        - created_at
      properties:
        id:
