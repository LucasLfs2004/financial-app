      responses:
        "201":
          description: Ajuste criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardInvoiceAdjustmentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
