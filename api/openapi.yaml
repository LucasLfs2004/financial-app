      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: A valid bearer token is required
    NotFound:
      description: Recurso inexistente ou pertencente a outro usuário
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Resource not found
    ValidationError:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Request validation failed
              details:
                field: start_month
                reason: must use YYYY-MM
    Conflict:
      description: A operação viola o estado atual ou uma regra de unicidade
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: The operation conflicts with the current resource state
