openapi: 3.1.0
info:
  title: Financial API
  version: 2.0.0-draft
  description: |
    API de planejamento financeiro pessoal.

    A Release 1 permite criar um planejamento principal, cadastrar rendas e
    despesas projetadas, definir quanto guardar e consultar um resumo mensal
    explicável pelas bases de competência (`reference`) e caixa (`cash`). A
    Release 2 adiciona instituições, cartões, vínculos temporais e faturas
    projetadas sem exigir o registro de compras individuais.
servers:
  - url: http://localhost:8080
    description: Ambiente local
security:
  - bearerAuth: []
tags:
  - name: Technical
    description: Saúde do processo e disponibilidade das dependências.
  - name: Identity
    description: Identidade e perfil do usuário autenticado.
  - name: Planning
    description: Ciclo de vida do planejamento financeiro principal.
  - name: Financial items
    description: Rendas, despesas projetadas e suas vigências.
  - name: Savings
    description: Valor planejado para guardar e suas vigências.
  - name: Financial institutions
    description: Instituições financeiras pertencentes ao usuário autenticado.
  - name: Credit cards
    description: Cartões e configurações mensais de vencimento e pagamento.
  - name: Payment methods
    description: Forma de pagamento das despesas por período de vigência.
  - name: Card invoices
    description: Faturas projetadas, ajustes e movimentações auditáveis.
  - name: Monthly summary
    description: Resultado mensal explicável nas bases de caixa e competência.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Technical]
      summary: Verificar se o processo está vivo
      security: []
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /ready:
    get:
      operationId: getReadiness
      tags: [Technical]
      summary: Verificar as dependências da API
      security: []
      responses:
        "200":
          description: API pronta para receber chamadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      summary: Consultar o perfil do usuário autenticado
      responses:
        "200":
          description: Perfil atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans:
    post:
      operationId: createPlan
      tags: [Planning]
      summary: Criar o planejamento principal em rascunho
      description: |
        Cada usuário pode possuir somente um planejamento principal não
        arquivado. O proprietário é sempre obtido do access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRequest"
            examples:
              annualPlan:
                value:
                  name: Planejamento 2026
                  start_month: 2026-01
                  end_month: 2026-12
                  currency_code: BRL
      responses:
        "201":
          description: Planejamento criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current:
    get:
      operationId: getCurrentPlan
      tags: [Planning]
      summary: Consultar o planejamento principal
      responses:
        "200":
          description: Planejamento principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateCurrentPlan
      tags: [Planning]
      summary: Alterar os metadados ou horizonte do rascunho
      description: |
        Nesta release, nome, horizonte e moeda somente podem ser alterados
        enquanto o planejamento estiver em `draft`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRequest"
      responses:
        "200":
          description: Planejamento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/activate:
    post:
      operationId: activateCurrentPlan
      tags: [Planning]
      summary: Ativar o planejamento e criar a referência original
      description: |
        A operação é idempotente. Uma nova chamada para um planejamento já
        ativo retorna a mesma fotografia original.
      responses:
        "200":
          description: Planejamento ativo e fotografia original
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanActivationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/original:
    get:
      operationId: getOriginalPlanSnapshot
      tags: [Planning]
      summary: Consultar a fotografia original imutável
      responses:
        "200":
          description: Fotografia criada na primeira ativação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalPlanSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/items:
    post:
      operationId: createFinancialItem
      tags: [Financial items]
      summary: Cadastrar uma renda ou despesa projetada
      description: O item e seu primeiro período são criados na mesma operação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinancialItemRequest"
            examples:
              recurringIncome:
                summary: Salário recebido no mês seguinte à referência
                value:
                  name: Salário
                  kind: recurring_income
                  description: Salário líquido
                  period:
                    start_month: 2026-01
                    end_month: 2026-12
                    amount_cents: 600000
                    recurrence: monthly
                    cash_month_offset: 1
                    context: Referente ao mês anterior
              fixedExpense:
                value:
                  name: Aluguel
                  kind: fixed_expense
                  period:
                    start_month: 2026-01
                    end_month: null
                    amount_cents: 150000
                    recurrence: monthly
                    cash_month_offset: 0
      responses:
        "201":
          description: Item criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listFinancialItems
      tags: [Financial items]
      summary: Listar as premissas financeiras do planejamento
      parameters:
        - $ref: "#/components/parameters/FinancialItemKindFilter"
        - $ref: "#/components/parameters/FinancialItemStatusFilter"
      responses:
        "200":
          description: Itens do planejamento autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialItemListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      operationId: getFinancialItem
      tags: [Financial items]
      summary: Consultar um item e seu histórico de períodos
      responses:
        "200":
          description: Item financeiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateFinancialItem
      tags: [Financial items]
      summary: Alterar nome ou descrição de um item
      description: Valores e vigências são alterados pelo endpoint de mudanças.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinancialItemRequest"
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/items/{item_id}/changes:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    post:
      operationId: changeFinancialItemFromMonth
      tags: [Financial items]
      summary: Alterar um item a partir de uma competência
      description: |
        Encerra o período aplicável no mês anterior e cria um novo período. A
        mudança preserva o passado e pode ser retroativa com rastreabilidade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinancialItemChangeRequest"
            example:
              effective_from: 2026-08
              end_month: null
              amount_cents: 650000
              cash_month_offset: 1
              context: Reajuste salarial
      responses:
        "201":
          description: Novo período criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PeriodOverlap"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/items/{item_id}/archive:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    post:
      operationId: archiveFinancialItem
      tags: [Financial items]
      summary: Arquivar um item sem apagar seu histórico
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveFinancialItemRequest"
      responses:
        "200":
          description: Item arquivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/savings:
    get:
      operationId: getPlannedSavings
      tags: [Savings]
      summary: Consultar os períodos do valor planejado para guardar
      responses:
        "200":
          description: Configuração explícita de economia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedSavingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: putPlannedSavings
      tags: [Savings]
      summary: Definir o valor para guardar a partir de um mês
      description: |
        O valor zero é uma configuração explícita e não equivale à ausência de
        configuração. A operação preserva os períodos anteriores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPlannedSavingsRequest"
            example:
              effective_from: 2026-01
              end_month: 2026-12
              amount_cents: 120000
              context: Reserva mensal
      responses:
        "200":
          description: Configuração atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedSavingsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PeriodOverlap"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/financial-institutions:
    post:
      operationId: createFinancialInstitution
      tags: [Financial institutions]
      summary: Cadastrar uma instituição financeira
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinancialInstitutionRequest"
            example:
              name: Nubank
      responses:
        "201":
          description: Instituição criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listFinancialInstitutions
      tags: [Financial institutions]
      summary: Listar instituições financeiras
      parameters:
        - $ref: "#/components/parameters/FinancialResourceStatusFilter"
      responses:
        "200":
          description: Instituições do usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitutionListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/financial-institutions/{institution_id}:
    parameters:
      - $ref: "#/components/parameters/InstitutionID"
    patch:
      operationId: updateFinancialInstitution
      tags: [Financial institutions]
      summary: Alterar o nome de uma instituição ativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinancialInstitutionRequest"
      responses:
        "200":
          description: Instituição atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/financial-institutions/{institution_id}/archive:
    parameters:
      - $ref: "#/components/parameters/InstitutionID"
    post:
      operationId: archiveFinancialInstitution
      tags: [Financial institutions]
      summary: Arquivar uma instituição sem apagar seu histórico
      description: A operação é rejeitada enquanto existir cartão ativo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveResourceRequest"
      responses:
        "200":
          description: Instituição arquivada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialInstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credit-cards:
    post:
      operationId: createCreditCard
      tags: [Credit cards]
      summary: Cadastrar um cartão e sua configuração inicial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditCardRequest"
            example:
              institution_id: 10acebec-c6ce-41f2-8732-f4ed622a7d51
              name: Principal
              configuration:
                effective_from: 2026-01
                end_month: null
                nominal_due_day: 6
                payment_month_offset: 1
                context: Fatura paga no mês seguinte
      responses:
        "201":
          description: Cartão criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/DomainRuleViolation"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listCreditCards
      tags: [Credit cards]
      summary: Listar cartões do usuário autenticado
      parameters:
        - $ref: "#/components/parameters/FinancialResourceStatusFilter"
      responses:
        "200":
          description: Cartões encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credit-cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/CardID"
    get:
      operationId: getCreditCard
      tags: [Credit cards]
      summary: Consultar um cartão e suas configurações
      responses:
        "200":
          description: Cartão encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateCreditCard
      tags: [Credit cards]
      summary: Alterar o nome de um cartão ativo
      description: A instituição pai é imutável depois da criação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCreditCardRequest"
      responses:
        "200":
          description: Cartão atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credit-cards/{card_id}/changes:
    parameters:
      - $ref: "#/components/parameters/CardID"
    post:
      operationId: changeCreditCardConfiguration
      tags: [Credit cards]
      summary: Alterar vencimento ou offset a partir de um mês
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditCardConfigurationChangeRequest"
      responses:
        "201":
          description: Novo período de configuração criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PeriodOverlap"
        "422":
          $ref: "#/components/responses/DomainRuleViolation"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credit-cards/{card_id}/archive:
    parameters:
      - $ref: "#/components/parameters/CardID"
    post:
      operationId: archiveCreditCard
      tags: [Credit cards]
      summary: Arquivar um cartão sem apagar suas faturas históricas
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveResourceRequest"
      responses:
        "200":
          description: Cartão arquivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/plans/current/items/{item_id}/payment-changes:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    post:
      operationId: changeFinancialItemPaymentMethod
      tags: [Payment methods]
      summary: Alterar a forma de pagamento de uma despesa por vigência
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentMethodChangeRequest"
            examples:
              creditCard:
                value:
                  effective_from: 2026-08
                  end_month: null
                  method: credit_card
                  credit_card_id: 0f9410d7-d545-4440-a574-b37836487c3c
                  context: Usar o cartão principal
              direct:
                value:
                  effective_from: 2026-10
                  end_month: null
                  method: direct
                  credit_card_id: null
      responses:
        "201":
          description: Novo período de pagamento criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodHistoryResponse"
        "400":
