      description: O mês é válido, mas está fora do horizonte do planejamento
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: month_outside_horizon
              message: The requested month is outside the plan horizon
    DomainRuleViolation:
      description: A requisição é válida, mas viola uma regra do domínio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_payment_method
              message: The payment method is incompatible with this resource
    InvoiceOutsideOperationalHorizon:
      description: A fatura está fora do horizonte operacional do planejamento
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invoice_outside_operational_horizon
              message: The invoice is outside the operational horizon
    InternalError:
      description: Falha interna inesperada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: An unexpected internal error occurred
    ServiceUnavailable:
      description: Uma dependência obrigatória está indisponível
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: service_unavailable
              message: A required dependency is temporarily unavailable
