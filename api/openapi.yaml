        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/credit-cards/{card_id}/invoices/{payment_month}/adjustments/{adjustment_id}/archive:
    parameters:
      - $ref: "#/components/parameters/CardID"
      - $ref: "#/components/parameters/PaymentMonth"
      - $ref: "#/components/parameters/AdjustmentID"
    post:
      operationId: archiveCardInvoiceAdjustment
      tags: [Card invoices]
      summary: Arquivar um ajuste preservando auditoria
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveResourceRequest"
      responses:
        "200":
          description: Ajuste arquivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardInvoiceAdjustmentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
